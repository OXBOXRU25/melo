; Сжатие HTML средствами PHP.
;
; Статику (стили и скрипты) отдаёт сам nginx, и его сжатие включается
; только в конфиге сервера — туда у нас доступа нет. А документ отдаёт
; PHP, и вот его мы сжать можем: 65 КБ превращаются в 13.
;
; Уровень 5, а не 9: выше девятого выигрыш уже доли процента, а процессор
; тратится на каждый запрос.
zlib.output_compression = On
zlib.output_compression_level = 5
